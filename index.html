<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>توك توك الحارة 3D</title>
<style>
:root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9cc9d8;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px #000;display:flex;flex-direction:column;justify-content:space-between;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.panel{background:#101820d9;border:1px solid #ffffff35;border-radius:14px;padding:9px 13px;backdrop-filter:blur(8px);font-weight:bold}
.stats{display:flex;gap:7px;flex-wrap:wrap}
.stat{font-size:14px}.stat b{color:#ffd166}
.mission{max-width:55%;text-align:center;font-size:14px;line-height:1.5}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.controls{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.steer{display:flex;gap:8px}
.ctrl{width:64px;height:64px;border-radius:18px;border:2px solid #ffffff70;background:#17232bd9;color:white;font-size:19px;font-weight:bold;touch-action:none;box-shadow:0 4px 12px #0005}
.ctrl:active,.ctrl.active{background:#e58b25}
.pedals{display:flex;gap:8px}.pedals .ctrl{height:76px;width:70px}
.hint{font-size:12px;opacity:.9;text-align:center;margin-top:5px}
#start{position:fixed;inset:0;background:linear-gradient(#101820c9,#101820ed);display:grid;place-items:center;z-index:5;padding:22px;text-align:center}
#start .card{max-width:440px;background:#1b2932;border:1px solid #ffffff35;border-radius:22px;padding:24px;box-shadow:0 20px 60px #0008}
#start h1{margin:0 0 8px;color:#ffd166;font-size:28px}
#start p{line-height:1.8;color:#e4edf0}
#play{border:0;border-radius:14px;background:#e58b25;color:#1b1712;font-size:20px;font-weight:bold;padding:14px 34px}
#toast{position:fixed;left:50%;top:25%;transform:translate(-50%,-50%);background:#111d;color:#fff;padding:12px 18px;border-radius:12px;font-weight:bold;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:85%}
@media(min-width:800px){.ctrl{width:72px;height:72px}.pedals .ctrl{height:84px;width:82px}.mission{font-size:16px}}
</style>
</head>
<body>
<div id="hud">
  <div class="top">
    <div class="panel stats">
      <div class="stat">💵 الأجرة: <b id="money">0</b> جنيه</div>
      <div class="stat">👥 الركاب: <b id="passengers">0/2</b></div>
      <div class="stat">⚡ السرعة: <b id="speed">0</b></div>
    </div>
    <div class="panel mission" id="mission">اتجه إلى الراكب المعلّم باللون الأصفر</div>
  </div>
  <div class="bottom">
    <div>
      <div class="controls steer">
        <button class="ctrl" data-control="left">◀ شمال</button>
        <button class="ctrl" data-control="right">يمين ▶</button>
      </div>
      <div class="hint">لف يمين / شمال</div>
    </div>
    <div class="controls pedals">
      <button class="ctrl" data-control="brake">فرامل</button>
      <button class="ctrl" data-control="gas">بنزين</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="start">
  <div class="card">
    <h1>🛺 توك توك الحارة 3D</h1>
    <p>لف في شوارع الحارة، اركب الركاب، ووصلهم بأمان علشان تجمع الأجرة.<br>تقدر تشيل راكبين في نفس الوقت.</p>
    <p>التحكم بالموبايل من الأزرار. على الكمبيوتر استخدم W A S D أو الأسهم.</p>
    <button id="play">ابدأ اللعب</button>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc9d8);
scene.fog = new THREE.Fog(0x9bc9d8, 55, 170);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe4f6ff, 0x66513b, 2.1));
const sun = new THREE.DirectionalLight(0xffe0a6, 2.1);
sun.position.set(-35, 65, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -90;
sun.shadow.camera.right = 90;
sun.shadow.camera.top = 90;
sun.shadow.camera.bottom = -90;
scene.add(sun);

const mat = (color, roughness = 0.85) => new THREE.MeshStandardMaterial({ color, roughness });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), mat(0x9c987b));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.08;
ground.receiveShadow = true;
scene.add(ground);

const roadMat = mat(0x34383b);
const sideMat = mat(0xb8a98a);
const lineMat = mat(0xe9d9a4);

function road(x, z, width, depth) {
  const surface = new THREE.Mesh(new THREE.BoxGeometry(width, 0.12, depth), roadMat);
  surface.position.set(x, 0, z);
  surface.receiveShadow = true;
  scene.add(surface);

  const curbA = new THREE.Mesh(new THREE.BoxGeometry(width, 0.18, 0.55), sideMat);
  curbA.position.set(x, 0.02, z - depth / 2 - 0.25);
  scene.add(curbA);
  const curbB = curbA.clone();
  curbB.position.z = z + depth / 2 + 0.25;
  scene.add(curbB);
}
road(0, 0, 14, 240);
road(0, 0, 240, 14);

for (let k = -100; k <= 100; k += 12) {
  const dashVertical = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.025, 4), lineMat);
  dashVertical.position.set(0, 0.075, k);
  scene.add(dashVertical);
  const dashHorizontal = new THREE.Mesh(new THREE.BoxGeometry(4, 0.025, 0.22), lineMat);
  dashHorizontal.position.set(k, 0.075, 0);
  scene.add(dashHorizontal);
}

const buildingMats = [0xd9ad7c, 0xc58f72, 0xd4c6a4, 0xaab4a1, 0xb9a0a0].map(c => mat(c));
function building(x, z, width, depth, height, variant) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    buildingMats[Math.abs(variant) % buildingMats.length]
  );
  body.position.y = height / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  const roof = new THREE.Mesh(new THREE.BoxGeometry(width + 0.25, 0.25, depth + 0.25), mat(0x8d7561));
  roof.position.y = height + 0.12;
  group.add(roof);

  for (let y = 2; y < height - 1; y += 2.8) {
    for (let xx = -width / 2 + 1; xx < width / 2 - 0.5; xx += 2.3) {
      const windowMesh = new THREE.Mesh(new THREE.BoxGeometry(0.85, 1.15, 0.08), mat(0x435d65, 0.35));
      windowMesh.position.set(xx, y, depth / 2 + 0.045);
      group.add(windowMesh);
    }
  }
  group.position.set(x, 0, z);
  scene.add(group);
}

for (let z = -105; z <= 105; z += 15) {
  if (Math.abs(z) < 9) continue;
  building(-17, z, 8, 8, 7 + (Math.abs(z) % 4) * 2, z + 110);
  building(17, z, 8, 8, 8 + (Math.abs(z) % 3) * 2, z + 113);
}
for (let x = -105; x <= 105; x += 15) {
  if (Math.abs(x) < 9) continue;
  building(x, -17, 8, 8, 7 + (Math.abs(x) % 4) * 2, x + 111);
  building(x, 17, 8, 8, 8 + (Math.abs(x) % 3) * 2, x + 114);
}

function createTukTuk() {
  const group = new THREE.Group();
  const green = mat(0x16794d);
  const yellow = mat(0xf3c742);
  const black = mat(0x202326);
  const glass = new THREE.MeshStandardMaterial({ color: 0x9acbd2, transparent: true, opacity: 0.55 });

  const base = new THREE.Mesh(new THREE.BoxGeometry(2.15, 0.65, 3.25), green);
  base.position.y = 0.95;
  group.add(base);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.05, 1.25, 1.75), yellow);
  cabin.position.set(0, 1.85, -0.45);
  group.add(cabin);

  const roof = new THREE.Mesh(new THREE.BoxGeometry(2.25, 0.18, 2.05), green);
  roof.position.set(0, 2.55, -0.45);
  group.add(roof);

  const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.8, 0.06), glass);
  windshield.position.set(0, 1.95, 1.34);
  group.add(windshield);

  const seat = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.22, 0.65), black);
  seat.position.set(0, 1.28, -0.35);
  group.add(seat);

  for (const x of [-1.13, 1.13]) {
    for (const z of [-1.05, 1.05]) {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.22, 16), black);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(x, 0.48, z);
      group.add(wheel);
    }
  }

  const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, 0.08), mat(0xfff0b0));
  lamp.position.set(0, 1.12, 1.67);
  group.add(lamp);

  group.traverse(object => { if (object.isMesh) object.castShadow = true; });
  return group;
}

const player = createTukTuk();
scene.add(player);

const controls = { gas: false, brake: false, left: false, right: false };
let started = false;
let money = 0;
let passengers = 0;
let speed = 0;
let heading = 0;
let missionMarker = null;
let toastTimeout = null;

const moneyEl = document.querySelector('#money');
const passengersEl = document.querySelector('#passengers');
const speedEl = document.querySelector('#speed');
const missionEl = document.querySelector('#mission');
const toastEl = document.querySelector('#toast');

function showToast(message) {
  toastEl.textContent = message;
  toastEl.style.opacity = 1;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => { toastEl.style.opacity = 0; }, 2100);
}

function randomStreetPoint() {
  // نقاط الوقوف قريبة من الشوارع المتقاطعة حتى لا يظهر الراكب داخل المباني.
  const alongX = Math.random() < 0.5;
  const lane = Math.random() < 0.5 ? -1 : 1;
  const distance = 24 + Math.random() * 70;
  return alongX
    ? new THREE.Vector3((Math.random() < 0.5 ? -1 : 1) * distance, 0, lane * 10)
    : new THREE.Vector3(lane * 10, 0, (Math.random() < 0.5 ? -1 : 1) * distance);
}

function createMarker(position, color) {
  const group = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.15, 8, 28), mat(color));
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 0.16;
  group.add(ring);

  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.4, 8), mat(color));
  pole.position.y = 1.2;
  group.add(pole);

  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.48, 14, 12), mat(color));
  orb.position.y = 2.65;
  group.add(orb);

  group.position.copy(position);
  scene.add(group);
  return group;
}

function setMissionMarker(color) {
  if (missionMarker) scene.remove(missionMarker);
  missionMarker = createMarker(randomStreetPoint(), color);
}

function nextPickup() {
  setMissionMarker(0xffd34e);
  missionEl.textContent = 'اتجه إلى الراكب الأصفر لالتقاطه';
}
function nextDestination() {
  setMissionMarker(0x55e0a0);
  missionEl.textContent = 'وصل الركاب إلى العلامة الخضراء لتحصل على الأجرة';
}
nextPickup();

function updateHud() {
  moneyEl.textContent = money;
  passengersEl.textContent = passengers + '/2';
  speedEl.textContent = Math.round(Math.abs(speed) * 8);
}

function tryMissionInteraction() {
  if (!missionMarker) return;
  const dx = player.position.x - missionMarker.position.x;
  const dz = player.position.z - missionMarker.position.z;
  if (Math.hypot(dx, dz) > 5.5) return;

  if (passengers < 2 && missionEl.textContent.includes('الأصفر')) {
    passengers++;
    showToast('🧍 تم ركوب راكب!');
    if (passengers === 2) nextDestination();
    else nextPickup();
  } else {
    const fare = passengers * 25;
    money += fare;
    showToast('💵 وصلت الركاب! +' + fare + ' جنيه');
    passengers = 0;
    nextPickup();
  }
  updateHud();
}

function setControl(name, value) {
  controls[name] = value;
  document.querySelectorAll('[data-control="' + name + '"]').forEach(button => {
    button.classList.toggle('active', value);
  });
}

document.querySelectorAll('[data-control]').forEach(button => {
  const name = button.dataset.control;
  button.addEventListener('pointerdown', event => {
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    setControl(name, true);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => {
    button.addEventListener(type, event => {
      event.preventDefault();
      setControl(name, false);
    });
  });
});

const keyMap = {
  ArrowUp: 'gas', w: 'gas', ArrowDown: 'brake', s: 'brake',
  ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right'
};
addEventListener('keydown', event => {
  const name = keyMap[event.key];
  if (name) { event.preventDefault(); setControl(name, true); }
});
addEventListener('keyup', event => {
  const name = keyMap[event.key];
  if (name) setControl(name, false);
});

document.querySelector('#play').addEventListener('click', () => {
  started = true;
  document.querySelector('#start').style.display = 'none';
  showToast('يلا بينا! دور على الراكب الأصفر');
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.04);

  if (started) {
    if (controls.gas) speed += 13 * delta;
    if (controls.brake) speed -= 19 * delta;
    else speed -= Math.sign(speed) * 3.8 * delta;
    speed = THREE.MathUtils.clamp(speed, -5, 19);

    const steering = (controls.left ? 1 : 0) - (controls.right ? 1 : 0);
    if (Math.abs(speed) > 0.25) {
      heading += steering * delta * (1.4 + Math.abs(speed) * 0.055) * Math.sign(speed);
    }

    player.rotation.y = heading;
    player.position.x += Math.sin(heading) * speed * delta;
    player.position.z += Math.cos(heading) * speed * delta;
    player.position.x = THREE.MathUtils.clamp(player.position.x, -112, 112);
    player.position.z = THREE.MathUtils.clamp(player.position.z, -112, 112);

    if (missionMarker) {
      missionMarker.position.y = 0.08 + Math.sin(performance.now() * 0.003) * 0.18;
      missionMarker.rotation.y += delta * 0.8;
      tryMissionInteraction();
    }
  }

  const cameraOffset = new THREE.Vector3(-Math.sin(heading) * 10, 6.5, -Math.cos(heading) * 10);
  camera.position.lerp(player.position.clone().add(cameraOffset), 0.09);
  camera.lookAt(player.position.x, 1.3, player.position.z + Math.cos(heading) * 3);
  renderer.render(scene, camera);
}

animate();
updateHud();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
