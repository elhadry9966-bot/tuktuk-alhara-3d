<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>توك توك الحارة 3D</title>
<style>
:root{color-scheme:dark;font-family:Tahoma,Arial,sans-serif}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bc9d8;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 5px #000;display:flex;flex-direction:column;justify-content:space-between;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.panel{background:#101820d9;border:1px solid #ffffff35;border-radius:14px;padding:9px 13px;backdrop-filter:blur(8px);font-weight:bold}
.stats{display:flex;gap:7px;flex-wrap:wrap}.stat{font-size:14px}.stat b{color:#ffd166}.mission{max-width:55%;text-align:center;font-size:14px;line-height:1.5}
.bottom{align-items:flex-end}.controls{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}.steer{display:flex;gap:8px}
.ctrl{width:64px;height:64px;border-radius:18px;border:2px solid #ffffff70;background:#17232bd9;color:white;font-size:18px;font-weight:bold;touch-action:none;box-shadow:0 4px 12px #0005}
.ctrl:active,.ctrl.active{background:#e58b25}.pedals .ctrl{height:76px;width:70px}.hint{font-size:12px;opacity:.9;text-align:center;margin-top:5px}
#start{position:fixed;inset:0;background:linear-gradient(#101820c9,#101820ed);display:grid;place-items:center;z-index:5;padding:22px;text-align:center}
#start .card{max-width:440px;background:#1b2932;border:1px solid #ffffff35;border-radius:22px;padding:24px;box-shadow:0 20px 60px #0008}
#start h1{margin:0 0 8px;color:#ffd166;font-size:28px}#start p{line-height:1.8;color:#e4edf0}
#play{border:0;border-radius:14px;background:#e58b25;color:#1b1712;font-size:20px;font-weight:bold;padding:14px 34px}
#toast{position:fixed;left:50%;top:25%;transform:translate(-50%,-50%);background:#111d;color:white;padding:12px 18px;border-radius:12px;font-weight:bold;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:85%}
@media(min-width:800px){.ctrl{width:72px;height:72px}.pedals .ctrl{height:84px;width:82px}.mission{font-size:16px}}
</style>
</head>
<body>
<div id="hud">
 <div class="top">
  <div class="panel stats">
   <div class="stat">💵 الأجرة: <b id="money">0</b> جنيه</div>
   <div class="stat">👥 الركاب: <b id="passengers">0/2</b></div>
   <div class="stat">⚡ السرعة: <b id="speed">0</b></div>
  </div>
  <div class="panel mission" id="mission">اتجه إلى الراكب المعلّم باللون الأصفر</div>
 </div>
 <div class="bottom">
  <div><div class="controls steer">
   <button class="ctrl" data-control="left">◀ شمال</button><button class="ctrl" data-control="right">يمين ▶</button>
  </div><div class="hint">لف يمين / شمال</div></div>
  <div class="controls pedals"><button class="ctrl" data-control="brake">فرامل</button><button class="ctrl" data-control="gas">بنزين</button></div>
 </div>
</div>
<div id="toast"></div>
<div id="start"><div class="card">
 <h1>🛺 توك توك الحارة 3D</h1>
 <p>لف في شوارع الحارة، اركب الركاب، ووصلهم بأمان علشان تجمع الأجرة.<br>تقدر تشيل راكبين في نفس الوقت.</p>
 <p>التحكم بالموبايل من الأزرار. على الكمبيوتر استخدم W A S D أو الأسهم.</p>
 <button id="play">ابدأ اللعب</button>
</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc9d8);
scene.fog=new THREE.Fog(0x9bc9d8,55,170);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe4f6ff,0x66513b,2.1));
const sun=new THREE.DirectionalLight(0xffe0a6,2.1);sun.position.set(-35,65,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-90;sun.shadow.camera.right=90;sun.shadow.camera.top=90;sun.shadow.camera.bottom=-90;scene.add(sun);
const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),mat(0x9c987b));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
const roadMat=mat(0x34383b),sideMat=mat(0xb8a98a),lineMat=mat(0xe9d9a4);
function road(x,z,width,depth){
 const surface=new THREE.Mesh(new THREE.BoxGeometry(width,.12,depth),roadMat);surface.position.set(x,0,z);surface.receiveShadow=true;scene.add(surface);
 const curb=new THREE.Mesh(new THREE.BoxGeometry(width,.18,.55),sideMat);curb.position.set(x,.02,z-depth/2-.25);scene.add(curb);
 const other=curb.clone();other.position.z=z+depth/2+.25;scene.add(other);
}
road(0,0,14,240);road(0,0,240,14);
for(let k=-100;k<=100;k+=12){
 const a=new THREE.Mesh(new THREE.BoxGeometry(.22,.025,4),lineMat);a.position.set(0,.075,k);scene.add(a);
 const b=new THREE.Mesh(new THREE.BoxGeometry(4,.025,.22),lineMat);b.position.set(k,.075,0);scene.add(b);
}
const buildingMats=[0xd9ad7c,0xc58f72,0xd4c6a4,0xaab4a1,0xb9a0a0].map(c=>mat(c));
function building(x,z,w,d,h,v){
 const g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),buildingMats[Math.abs(v)%buildingMats.length]);
 body.position.y=h/2;body.castShadow=true;body.receiveShadow=true;g.add(body);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.25,.25,d+.25),mat(0x8d7561));roof.position.y=h+.12;g.add(roof);
 for(let y=2;y<h-1;y+=2.8)for(let xx=-w/2+1;xx<w/2-.5;xx+=2.3){
  const win=new THREE.Mesh(new THREE.BoxGeometry(.85,1.15,.08),mat(0x435d65,.35));win.position.set(xx,y,d/2+.045);g.add(win);
 }
 g.position.set(x,0,z);scene.add(g);
}
for(let z=-105;z<=105;z+=15){if(Math.abs(z)<9)continue;building(-17,z,8,8,7+(Math.abs(z)%4)*2,z+110);building(17,z,8,8,8+(Math.abs(z)%3)*2,z+113)}
for(let x=-105;x<=105;x+=15){if(Math.abs(x)<9)continue;building(x,-17,8,8,7+(Math.abs(x)%4)*2,x+111);building(x,17,8,8,8+(Math.abs(x)%3)*2,x+114)}

function createPerson(clothesColor=0x315c8c){
 const person=new THREE.Group(),clothes=mat(clothesColor),skin=mat(0xb9784f),dark=mat(0x282522);
 const torso=new THREE.Mesh(new THREE.BoxGeometry(.62,.78,.34),clothes);torso.position.y=.92;person.add(torso);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.23,14,12),skin);head.position.y=1.48;person.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.235,14,10,0,Math.PI*2,0,Math.PI*.48),dark);hair.position.y=1.56;person.add(hair);
 for(const side of [-1,1]){
  const arm=new THREE.Mesh(new THREE.BoxGeometry(.18,.62,.2),clothes);arm.position.set(side*.39,.94,0);arm.rotation.z=side*-.12;person.add(arm);
  const leg=new THREE.Mesh(new THREE.BoxGeometry(.22,.58,.25),dark);leg.position.set(side*.17,.29,0);person.add(leg);
 }
 person.traverse(o=>{if(o.isMesh)o.castShadow=true});return person;
}
function createTukTuk(){
 const group=new THREE.Group(),green=mat(0x16794d),yellow=mat(0xf3c742),black=mat(0x202326);
 const glass=new THREE.MeshStandardMaterial({color:0x9acbd2,transparent:true,opacity:.55});
 const base=new THREE.Mesh(new THREE.BoxGeometry(2.15,.65,3.25),green);base.position.y=.95;group.add(base);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.05,1.25,1.75),yellow);cabin.position.set(0,1.85,-.45);group.add(cabin);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(2.25,.18,2.05),green);roof.position.set(0,2.55,-.45);group.add(roof);
 const windshield=new THREE.Mesh(new THREE.BoxGeometry(1.7,.8,.06),glass);windshield.position.set(0,1.95,1.34);group.add(windshield);
 const seat=new THREE.Mesh(new THREE.BoxGeometry(1.5,.22,.65),black);seat.position.set(0,1.28,-.35);group.add(seat);
 for(const x of [-1.13,1.13])for(const z of [-1.05,1.05]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.22,16),black);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.48,z);group.add(wheel);
 }
 const lamp=new THREE.Mesh(new THREE.BoxGeometry(.5,.25,.08),mat(0xfff0b0));lamp.position.set(0,1.12,1.67);group.add(lamp);
 group.traverse(o=>{if(o.isMesh)o.castShadow=true});return group;
}
const player=createTukTuk();scene.add(player);
const controls={gas:false,brake:false,left:false,right:false};
let started=false,money=0,passengers=0,speed=0,heading=0,missionMarker=null,toastTimeout=null;
const passengerVisuals=[];
const moneyEl=document.querySelector('#money'),passengersEl=document.querySelector('#passengers'),speedEl=document.querySelector('#speed');
const missionEl=document.querySelector('#mission'),toastEl=document.querySelector('#toast');
function showToast(message){toastEl.textContent=message;toastEl.style.opacity=1;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toastEl.style.opacity=0,2100)}
function randomStreetPoint(){
 const alongX=Math.random()<.5,lane=Math.random()<.5?-1:1,distance=24+Math.random()*70;
 return alongX?new THREE.Vector3((Math.random()<.5?-1:1)*distance,0,lane*10):new THREE.Vector3(lane*10,0,(Math.random()<.5?-1:1)*distance);
}
function createMarker(position,color){
 const group=new THREE.Group(),ring=new THREE.Mesh(new THREE.TorusGeometry(1.4,.15,8,28),mat(color));ring.rotation.x=Math.PI/2;ring.position.y=.16;group.add(ring);
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,2.4,8),mat(color));pole.position.y=1.2;group.add(pole);
 const orb=new THREE.Mesh(new THREE.SphereGeometry(.48,14,12),mat(color));orb.position.y=2.65;group.add(orb);
 // شخصية الراكب المنتظر تقف بجوار علامة الالتقاط.
 const waitingPerson=createPerson(0x315c8c);waitingPerson.scale.setScalar(.88);waitingPerson.position.set(2,0,0);group.add(waitingPerson);
 group.position.copy(position);scene.add(group);return group;
}
function setMissionMarker(color){if(missionMarker)scene.remove(missionMarker);missionMarker=createMarker(randomStreetPoint(),color)}
function nextPickup(){setMissionMarker(0xffd34e);missionEl.textContent='اتجه إلى الراكب الأصفر لالتقاطه'}
function nextDestination(){setMissionMarker(0x55e0a0);missionEl.textContent='وصل الركاب إلى العلامة الخضراء لتحصل على الأجرة'}
nextPickup();
function updateHud(){moneyEl.textContent=money;passengersEl.textContent=passengers+'/2';speedEl.textContent=Math.round(Math.abs(speed)*8)}
function tryMissionInteraction(){
 if(!missionMarker)return;
 const dx=player.position.x-missionMarker.position.x,dz=player.position.z-missionMarker.position.z;
 if(Math.hypot(dx,dz)>5.5)return;
 if(passengers<2&&missionEl.textContent.includes('الأصفر')){
  passengers++;
  // إظهار الراكب داخل التوك توك بعد صعوده.
  const seated=createPerson(passengers===1?0x315c8c:0x9a4b32);seated.scale.setScalar(.58);
  seated.position.set(passengers===1?-.48:.48,1.15,-.78);seated.rotation.y=Math.PI;player.add(seated);passengerVisuals.push(seated);
  showToast('🧍 تم ركوب راكب!');
  if(passengers===2)nextDestination();else nextPickup();
 }else{
  const fare=passengers*25;money+=fare;showToast('💵 وصلت الركاب! +'+fare+' جنيه');
  for(const person of passengerVisuals)player.remove(person);passengerVisuals.length=0;passengers=0;nextPickup();
 }
 updateHud();
}
function setControl(name,value){controls[name]=value;document.querySelectorAll('[data-control="'+name+'"]').forEach(b=>b.classList.toggle('active',value))}
document.querySelectorAll('[data-control]').forEach(button=>{
 const name=button.dataset.control;
 button.addEventListener('pointerdown',e=>{e.preventDefault();button.setPointerCapture(e.pointerId);setControl(name,true)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(type=>button.addEventListener(type,e=>{e.preventDefault();setControl(name,false)}));
});
const keyMap={ArrowUp:'gas',w:'gas',ArrowDown:'brake',s:'brake',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};
addEventListener('keydown',e=>{const n=keyMap[e.key];if(n){e.preventDefault();setControl(n,true)}});
addEventListener('keyup',e=>{const n=keyMap[e.key];if(n)setControl(n,false)});
document.querySelector('#play').addEventListener('click',()=>{started=true;document.querySelector('#start').style.display='none';showToast('يلا بينا! دور على الراكب الأصفر')});
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);const delta=Math.min(clock.getDelta(),.04);
 if(started){
  if(controls.gas)speed+=13*delta;if(controls.brake)speed-=19*delta;else speed-=Math.sign(speed)*3.8*delta;
  speed=THREE.MathUtils.clamp(speed,-5,19);
  const steering=(controls.left?1:0)-(controls.right?1:0);
  if(Math.abs(speed)>.25)heading+=steering*delta*(1.4+Math.abs(speed)*.055)*Math.sign(speed);
  player.rotation.y=heading;player.position.x+=Math.sin(heading)*speed*delta;player.position.z+=Math.cos(heading)*speed*delta;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-112,112);player.position.z=THREE.MathUtils.clamp(player.position.z,-112,112);
  if(missionMarker){missionMarker.position.y=.08+Math.sin(performance.now()*.003)*.18;missionMarker.rotation.y+=delta*.8;tryMissionInteraction()}
 }
 const offset=new THREE.Vector3(-Math.sin(heading)*10,6.5,-Math.cos(heading)*10);
 camera.position.lerp(player.position.clone().add(offset),.09);camera.lookAt(player.position.x,1.3,player.position.z+Math.cos(heading)*3);
 renderer.render(scene,camera);
}
animate();updateHud();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
